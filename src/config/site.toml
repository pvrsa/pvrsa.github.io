[config.site]
title = "YOUR_NAME"
description = "YOUR_DESCRIPTION"
pageTitle = "YOUR_NAME | Personal Site"
pageDescription = "YOUR_DESCRIPTION"
repository = "https://github.com/YOUR_GITHUB/YOUR_REPO"
footerNote = ""

[config.vibe]
showTrail = true

[config.theme]
# Available palettes:
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.comments]
enabled = false
provider = "giscus"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.blog]
postsPerPage = 6

[config.comments.giscus]
repo = "dodolalorc/astro-navfolio"
repo_id = "R_kgDOSaQejw"
category = "Announcements"
category_id = "DIC_kwDOSaQej84C9di9"
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

[config.comments.utterances]
repo = ""
issue_term = "pathname"
label = "comment"
theme = "github-light"

[config.comments.waline]
server_url = ""
lang = "zh-CN"
dark = "html.dark"
pageview = true
comment = true

[config.profile]
name = "YOUR_NAME"
handle = "@YOUR_HANDLE"
role = "YOUR_ROLE"
company = "YOUR_COMPANY"
location = "YOUR_LOCATION"
email = "your@email.com"
website = "https://your-site.github.io"
github = "https://github.com/YOUR_GITHUB"
meta = "YOUR_META"
avatar = "/images/logo.png"

[[config.topNav.links]]
label = "Home"
href = "/"

[[config.topNav.links]]
label = "Blog"
href = "/blog"

[[config.topNav.links]]
label = "Vibe"
href = "/vibe"

[[config.topNav.links]]
label = "About"
href = "/about"

[config.home]
layout = "grid"

[config.home.quote]
text = [
  "Add your quote here."
]
image = "/images/logo-with-name.png"

[config.home.intro]
title = "hi, I'm ..."
name = "Your Name"
body = [
  "Add a short bio here.",
  "What do you work on? What do you care about?"
]
image = "/images/logo-cat.png"

[config.home.latest]
count = 1
heatmapWeeks = 24
showHeatmapLatest = true
excludeDraft = true
startDate = ""
dateArchiveBaseHref = ""

[[config.home.navigation]]
icon = "pen"
title = "Blog"
subtitle = "Essays, notes, and field reports"
href = "/blog"

[[config.home.navigation]]
icon = "compass"
title = "Vibe"
subtitle = "Short thoughts and fragments"
href = "/vibe"

[[config.home.navigation]]
icon = "briefcase"
title = "About"
subtitle = "Who I am and what I do"
href = "/about"

[[config.home.connect]]
label = "GitHub"
href = "https://github.com/YOUR_GITHUB"
icon = "github"

[[config.home.connect]]
label = "Blog"
href = "/blog"
icon = "book"

[[config.home.connect]]
label = "Vibe"
href = "/vibe"
icon = "compass"

[[config.home.connect]]
label = "Email"
href = "mailto:your@email.com"
icon = "mail"

[[config.home.doing]]
text = "Add what you are working on"
