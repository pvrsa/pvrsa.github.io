<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Solarized Light Base: base3 (#fdf6e3) to base2 (#eee8d5) -->
    <linearGradient id="bg-solarized" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e3" />
      <stop offset="100%" stop-color="#eee8d5" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Solarized base1/base00 subtle border -->
  <rect width="512" height="512" rx="128" fill="url(#bg-solarized)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#93a1a1" stroke-opacity="0.35" stroke-width="2.5" />

  <!-- Dual Slashes: Solarized Green (#859900) + Cyan (#2aa198) -->
  <g transform="translate(0, 0)">
    <!-- First Slash (Solarized Green) -->
    <line x1="68" y1="334" x2="128" y2="178" stroke="#859900" stroke-width="28" stroke-linecap="round" />
    <!-- Second Slash (Solarized Cyan) -->
    <line x1="120" y1="334" x2="180" y2="178" stroke="#2aa198" stroke-width="28" stroke-linecap="round" />

    <!-- Monospace Text 'pvr' in Solarized base00 (#657b83) -->
    <text x="216" y="306" 
          font-family="'Maple Mono', ui-monospace, Menlo, Consolas, Monaco, monospace" 
          font-size="142" 
          font-weight="700" 
          letter-spacing="-2"
          fill="#586e75">pvr</text>
  </g>
</svg>
