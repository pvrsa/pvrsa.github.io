<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <style>
    /* Default: Solarized Light */
    .bg { fill: url(#bg-light); }
    .border { stroke: #93a1a1; stroke-opacity: 0.35; }
    .slash-1 { stroke: #859900; }
    .slash-2 { stroke: #2aa198; }
    .label { fill: #586e75; }

    /* Dark Mode: Terminal Mint */
    @media (prefers-color-scheme: dark) {
      .bg { fill: url(#bg-dark); }
      .border { stroke: rgba(255, 255, 255, 0.1); }
      .slash-1 { stroke: #10b981; }
      .slash-2 { stroke: #34d399; }
      .label { fill: #34d399; }
    }
  </style>

  <defs>
    <!-- Solarized Light Gradient -->
    <linearGradient id="bg-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf6e3" />
      <stop offset="100%" stop-color="#eee8d5" />
    </linearGradient>

    <!-- Terminal Mint Dark Gradient -->
    <linearGradient id="bg-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="512" height="512" rx="128" class="bg" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" class="border" stroke-width="2.5" />

  <!-- Dual Slashes: Centered -->
  <g transform="translate(0, 0)">
    <line x1="68" y1="334" x2="128" y2="178" class="slash-1" stroke-width="28" stroke-linecap="round" />
    <line x1="120" y1="334" x2="180" y2="178" class="slash-2" stroke-width="28" stroke-linecap="round" />

    <!-- Monospace Text 'pvr' -->
    <text x="216" y="306" 
          font-family="'Maple Mono', ui-monospace, Menlo, Consolas, Monaco, monospace" 
          font-size="142" 
          font-weight="700" 
          letter-spacing="-2"
          class="label">pvr</text>
  </g>
</svg>
